## 2.5 Reproduce the original symptom against the running app

The regression test proves the fix at the level the test suite can see. A bug reported as a broken
screen, a wrong redirect or a mangled export is *also* a claim about what a person observes, and a
green test is not that observation.

Read `quality.functional_check` from `FLOW.md` (empty → whatever is available: a browser automation
