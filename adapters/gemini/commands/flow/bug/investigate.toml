- Involved lines: `file:NN-MM`
- Logs / traces that confirm it:

## Why tests/CI did not catch it
<2-3 lines>

## Areas with similar risk (same pattern)
- explain

## Constraints for the fix
- Do not touch X because…
- Consider Y because…

## Investigation challenges
<filled in by §5 with the challenger table>
```

## 5. Root cause challenge (challenger)

Before closing, launch a `Agent general-purpose` challenger with this task:

> You are the critical reviewer of the investigation in `.claude/work/<TICKET>/03-investigation.md`. **Do not propose a fix.** Challenge the root cause from 3 angles:
>
> 1. **Is there a more probable root cause that was not considered?** Read `02-diagnose.md` (symptom) and `03-investigation.md` (proposed cause). Does all the evidence fit this cause, or are there pieces it does not explain? What alternative causes would also explain the symptom?
> 2. **Are there gaps in the evidence chain?** Reasoning steps without support from logs/commits/data. Flag them.
> 3. **Is the symptom being confused with the cause?** (e.g. "null pointer" is a symptom; the cause is "the data arrives null because X").
>
> Output: markdown table `| Angle | Finding | Severity |` (high/medium/low). Under 400 words. If there are no relevant findings for an angle, say "no findings".

Consolidate at the end of `03-investigation.md` under:

```markdown
## Investigation challenges

| Angle | Finding | Severity | Response |
|-------|---------|----------|----------|
```

**`high` severity with no response** → ask with `AskUserQuestion`:
- **Reopen investigation** (back to §2 with the alternative cause).
- **Accept and document** (fill in "Response" with the justification, e.g. `"Dismissed: we already verified that commit X does not touch this line"`).

Do not proceed with unresolved high severities — a fix on a wrong root cause is how incidents reappear.

## 6. Is the size still correct?

If the bug turned out simpler or wider than `meta.json.size` says (multi-component regression, corrupt data, race condition), propose reclassifying with `AskUserQuestion` and update `meta.json.size`. Raise to L when the impact warrants a mandatory postmortem.

## 7. Domain finding staging

If `domain_memory.enabled` and the root cause reveals a **non-obvious "why"** about the domain (a false model assumption, a historical decision that no longer applies, an undocumented external-integration behaviour), stage it. Silence by default — only on a clear signal.

- `mcp__domain-memory__stage_finding` with the finding and context, one call per finding.
- Notify the user: "Staged X domain finding(s) to consolidate in `/flow:bug:postmortem`".
- Never `save_knowledge` here — that belongs to the postmortem.

## 8. Close

- Update `meta.json`: `phase = "investigate"`, add to `phases_done`.
- Overwrite `00-summary.md` whole (≤15 lines, flow-core §5).
- Suggest `/flow:bug:fix`.
- **Autonomy handoff** (`autonomy.mode`, flow-core §2): `manual` → propose `/flow:bug:fix` with a single `AskUserQuestion`, invoke it only on confirmation; `guided`/`auto` → chain into it in this same turn.
