description = "Point the main checkout at a branch to test it (then return), re-syncing per FLOW.md"

prompt = """
# `/flow:work:try {{args}}`

> **gemini adapter — how the Claude Code primitives named below map here.**
> - `AskUserQuestion` → ask in plain text with numbered options and wait for the reply.
> - `Agent <role>` / `Agent general-purpose` / subagents → `@<name>` from `.gemini/agents/`; the name comes from `agents.<role>` in `FLOW.md`, empty or absent → do it in this context.
> - Parallel fan-out → several `@name` in one turn (sequential in this context if none are configured), capped at `agents.fanout_max` (empty → 4); `agents.fanout_tool` is Claude Code-only, ignore it.
> - `ScheduleWakeup` / `Monitor` / `/loop` → not available in-session: run one cycle, persist state in `monitor.md`, let the user schedule `gemini -p "<command>"` with cron.
> - `TaskCreate` → a markdown checklist in the phase artifact.
> - `Skill commit-commands:commit-push-pr` → `git add` · `git commit` · `git push -u origin HEAD` · the `git.cli` CLI (`gh pr create` / `glab mr create`). `Skill save-knowledge` → `/flow:save-knowledge`.
> - `/model <value>` → the `--model` flag at launch.
> - `knowledge.*` roles → whatever tools `FLOW.md` names there; an MCP tool keeps its name, its server is declared under `mcpServers` in `settings.json` (see `settings.snippet.json`).

Read `~/.claude/flow/CORE.gemini.md` first (\\g<what>) — skip if you already read it in this session.

Temporarily point the **main checkout** at another branch to test it against this checkout's live environment (running stack, DB, containers), then return — a generic `make wt-try`/`wt-back` pair. The git switch is built in; the project-specific re-sync (e.g. migrations) comes from `git.worktree_resync` in `FLOW.md`. Operates **in place**; never creates or touches worktrees.

## 1. Parse the argument

- `{{args}}` is a **branch name** → *Try mode* (§3).
- `{{args}}` is `--back` (or `back`, or empty while the checkout is in a detached "try" state) → *Back mode* (§4).
- Anything else / ambiguous → ask the user which branch to try, or `--back` to return.
- Read `git.worktree_resync` from `FLOW.md`: commands (one per line) to run after switching. Empty/absent → no re-sync (git switch only).

## 2. Clean-tree guard (both modes)

```bash
git status --porcelain
```
Uncommitted or staged changes → **stop**: switching would carry them over. Tell the user to commit or stash first. Do not `--force` anything.

## 3. Try mode — `/flow:work:try <branch>`

1. Resolve the branch: `<branch>` exists locally → use it; otherwise `git fetch origin` and use `origin/<branch>` (tell the user you are using the remote ref).
2. Switch the main checkout in **detached HEAD** (you are only testing, not committing onto that branch):
   ```bash
   git switch --detach <branch>       # or origin/<branch>
   ```
   `git switch -` in §4 returns you to the branch you were on before this.
3. **Re-sync the environment** with `git.worktree_resync`. These commands can be invasive (schema migrations, container rebuilds): show the exact list and confirm before running (`AskUserQuestion`: Run / Skip). On confirm, run them **in order**, stopping and reporting if one fails. Empty → skip silently.
4. Report: now on `<branch>` (detached), which re-sync commands ran, and that `/flow:work:try --back` returns to the previous branch.
5. **Then §3.5** — the environment being ready is exactly when the test plan is useful.

## 3.5 Serve the manual test plan

Find the work behind the branch: a `meta.json` whose `branch`, or one of whose `mrs[].branch`,
matches. **None → stop here**; this command keeps its old behaviour and invents nothing.

The plan already exists; the user should not have to ask for it. Source it in this order:

1. **`07-validation.md` (or `05-validation.md` for a bug) exists** → the criteria still
   `needs-manual` or `unproven`, each as numbered steps and the expected observation, in the
   given/when/then wording `/flow:feat:validate` §4 uses. Criteria already `proven-by-test`,
   `proven-by-agent` or `proven-manually` get **one line together** saying so — never repeat them.
2. **No validation artifact yet** → the enumerated acceptance criteria from `03-design.md`, all of
   them, flagged *not yet classified — `validate` has not run*. For a bug with no validation
   artifact, the reproduction steps from `02-diagnose.md`.
3. **Neither** → say so plainly and stop. Do not compose a plan out of the diff.

**Offer to collect the verdicts here.** One `AskUserQuestion`, the same shape as
`/flow:feat:validate` §4 — **Pass** · **Fail** · **Blocked**, up to four criteria per question —
written straight into the validation artifact with the date. This is what turns `try` into the
natural entrance to the assisted loop instead of a detour from it: `validate` sends the user here,
and until now the plan did not come with them. Declining leaves the plan printed and writes nothing.

Printing the plan is free in every `autonomy.mode`. Collecting verdicts needs the user's answers by
construction, so `guided`/`auto` change nothing here.

## 4. Back mode — `/flow:work:try --back`

1. Clean-tree guard (§2).
2. Return to the previous branch:
   ```bash
   git switch -
   ```
   If it fails (no previous branch recorded), tell the user which branch to switch to manually.
3. Re-sync again with `git.worktree_resync` (same confirm-then-run as §3.3).
4. Report the branch you are back on and which re-sync commands ran.
5. **Close the loop** when §3.5 resolved a work on the way in: what was verified during this try
   session, what is still `unproven`, and the next step — `/flow:feat:validate` (or
   `/flow:bug:validate`) to finish the gate. Nothing verified → say that, in one line.

## Notes

- Detached HEAD is deliberate: no accidental commits onto the branch you are only testing.
- Never pushes, never touches the base branch's history — a local, reversible convenience.
- Put every re-sync command your project needs in `git.worktree_resync`; they run in order.
"""
