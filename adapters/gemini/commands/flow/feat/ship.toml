## 6. Close

### 6.1 Update `meta.json` per scenario

**A) The MR/PR was created (and merged, if the flow reached that)** (normal case):
- **No `mrs` or only 1**: add `ship` to `phases_done`, update `updated_at`. `phase = "done"` **only if the user confirms it was actually merged** — one `AskUserQuestion` (same question as the multi-delivery case; right after §3 the MR/PR is open and the normal answer is no). Not merged → leave `phase = "ship"`: `/flow:work:green` and `/flow:work:respond` operate on the open MR/PR and `/flow:work:clean` only sweeps what merged.
- **Multi-delivery build**: record the current MR/PR's `url` in its `meta.json.mrs` entry. `status` = `merged` **only if the user confirms it was actually merged**; otherwise keep `in_progress` — **the train does not require the current MR/PR to be merged to proceed**. Still `pending` entries → leave `phase = "build"` and go to §6.2. All entries `merged`/`closed`/`superseded` → `phase = "done"`.

**B) The MR/PR was closed without merge** (rejected, discarded by reviewers):
- Mark the current entry `closed` with a `note` explaining the reason.
- Ask the user: retry with a different approach (`/flow:feat:build`) or consider the feature unviable (`/flow:work:abandon`)? Do not decide alone.

**C) The plan changed and this MR/PR is no longer needed**:
- Mark the entry `superseded` with `note` pointing to the new MR/PR.

In every scenario:
- **A merged badge is not the tree.** Whenever the user confirms a merge, verify the content actually reached the base before recording it — mandatory when the entry has `stacked_on` set, cheap enough to be worth it always:

  ```bash
  git fetch --prune origin
  git ls-tree -r origin/<git.default_base> --name-only -- <a path this MR/PR creates>
  ```

  Nothing back → the content is **not** on the base whatever the forge says (see §6.2.1). Do not mark the entry `merged`: leave it `in_progress` with a `note`, tell the user in one line, and recover it with a fresh MR/PR against `git.default_base` before the train moves on.
- Refresh `panel.json` from the updated `meta.json`. A shipped-but-open MR/PR is a `wait` line carrying its `link`; it becomes `done` only when confirmed merged. When this ship sets `phase = "done"`, say so in plain words (`mark: "info"` with `style: "ok"`: nothing left here) and drop the `Decision` line.
- Overwrite `00-summary.md` whole (≤15 lines, flow-core §5).

### 6.1.1 Tracker: move to done

**Only when this ship sets `phase = "done"`** (single MR/PR merged, or the last of a train — never on an intermediate train MR/PR), and only if `tracker.tool` is not `none`/empty, `tracker.done_cmd` is set, and `meta.json.ticket` is a **real tracker id**. `phase = "done"` already implies the completing MR/PR was confirmed merged — this fires at genuine completion, not at the archive prompt in §6.3.

Run `tracker.done_cmd` substituting `{TICKET}` = `meta.json.ticket`. Same contract as `/flow:feat:start §6.5`: **best-effort, idempotent, gated** (`autonomy.mode: manual` → ask once before running; `guided`/`auto` → run automatically). Failure or already-done ticket → warn in one line and continue, never block. **On GitHub/GitLab leave `tracker.done_cmd` empty** — `Closes #N` in the body (§2) already auto-closes on merge; this step is for trackers that do not transition from git (Jira, Linear).

### 6.2 Train continuation (only if `meta.json.mrs` still has `pending` entries)

A train builds the next MR/PR **without waiting for the current one to merge**. Do not stop here to wait for the merge. Resolve `git.train_chain` from FLOW.md (`ask` | `always` | `wait`; **empty → derive from `autonomy.mode`**: `manual` → `ask`, `guided`/`auto` → `always`).

First identify the **next startable MR/PR**: the `pending` one with the lowest `n` whose `depends_on` are all `merged` (same rule as `/flow:feat:build §1`). Then its **base branch**:

- **Depends on the current MR/PR** (`depends_on` includes the current `n`) → real train: base = the current branch (stacked).
- **Parallel sibling** (does not depend on the current MR/PR) → **not** part of this train: base = `git.default_base`, `stacked_on` = null. Never stack an independent MR/PR on an unrelated branch.

Then act on `git.train_chain`:

- **`wait`**: do not continue now. Leave `phase = "build"`; tell the user to run `/flow:feat:build` once the current MR/PR is merged. Happens **only** when explicitly configured.
- **`ask`**: `AskUserQuestion` — "Continue now with the next MR/PR (#\\<n\\> «\\<title\\>»), based on \\<its base branch per the rule above\\>?". **No** → stop and recommend `/flow:feat:build`. **Yes** → as `always`.
- **`always`**: continue automatically; record the decision in the artifact, **do not prompt** — not "shall I start #\\<n\\>?", and never "shall I wait for #\\<n-1\\> to merge?" (`wait` is the only value that holds the train; see the never-ask list in flow-core §2).

To continue (both `ask`→yes and `always`):
1. Create the next branch per `/flow:feat:start §5` with the **base chosen above** (explicit base, `--no-track`, worktree per `git.worktree`) and, for `tracker.tool: gh`, the linked-branch step `/flow:feat:start §5.5` (same base). Train (depends on the current one) → record `stacked_on` = current branch in `meta.json`; parallel sibling → `stacked_on` = null.
2. Leave `phase = "build"` (`/flow:feat:build §1` picks the next `pending` MR/PR and marks it `in_progress`).
3. Chain into `/flow:feat:build`.

This continuation is **not** a hard gate: a stacked branch on an explicit, unambiguous parent is safe, and creating MR/PR #\\<n+1\\> in its own `/flow:feat:ship` will still stop and ask. Never hold the train back solely to wait for a merge unless `train_chain: wait`.

### 6.2.1 The parent merged first — re-target the child, or it merges nowhere

A stacked MR/PR targets **its parent branch**, not `git.default_base`. When the parent is merged first — and a **squash** merge above all — the child's target stops being an ancestor of the base branch, and merging the child then lands its content **nowhere**: the forge marks it merged and `git.default_base` never receives a line of it. Measured: a child merged 34 seconds after its parent was squash-merged; a whole decision-record entry and its guard were missing from `main`, and nothing surfaced it until somebody read the tree.

**Prevention, whenever this work has a stacked MR/PR open** (a `meta.json.mrs[]` entry with a `url` and `stacked_on` not null) — check at this Close and again at every `/flow:work:resume`:

```bash
git fetch --prune origin
git branch -r --contains "origin/<parent branch>" | grep -q "origin/<git.default_base>"   # parent still an ancestor?
```

- **Parent still open** → say it in one line: the child merges first, or is re-targeted before the parent goes in. Never leave the order to chance when both are mergeable.
- **Parent no longer an ancestor** (merged, squashed, or its branch deleted) and the child **still open** → **hard gate** (a rebase and a force-push, in every autonomy mode). Re-target and replay: `gh pr edit <n> --base <git.default_base>` (or `glab mr update <iid> --target-branch <git.default_base>`), then `git rebase --onto "origin/<git.default_base>" "<old parent>" "<child branch>"` and force-push per the repo's rules. One MR/PR is kept, review history included.

**Re-target before the parent merges, not after — the window closes.** Merging the parent with `--delete-branch` deletes the child's target branch, and the forge then **auto-closes the child**; a closed PR cannot be re-targeted, so what was a one-command fix becomes a new MR/PR and a lost review thread. And when `gh pr edit --base` fails (`exit 1`, a GraphQL error about Projects classic — it happens on repos with the classic projects field), re-target through the REST API instead, with the MR/PR **open** (on a closed one it answers 422):

```bash
gh api -X PATCH "repos/<owner>/<repo>/pulls/<n>" -f base=<git.default_base>
```
- **Parent no longer an ancestor and the child already merged into it** → the content is lost to the base, not to git. Recover it as a fresh MR/PR against `git.default_base` (`git cherry-pick` the child's commits, or re-apply its tree), mark the old entry `superseded` with a `note` pointing at the new one, and tell the user plainly what was missing from the base and for how long.

### 6.3 Summary and cleanup

Report **following the stop header** (flow-core §3): ticket, MR/PR URL, changed files, added tests. In a multi-delivery work the `Plan:` line is **mandatory** and lists **every** entry with its real state — shipped with URL, reviewed but not pushed, pending — read from `meta.json.mrs`.

**Cross-repo reminder**: if `meta.json.related_repos` has any entry not `done`, call it out explicitly now. For each: *"you've shipped the `<this-repo>` part; `<repo>` still needs: `<scope>` → go there and run `/flow:feat:start <TICKET>` (or `/flow:bug:start`)"*. flow never touches or scans the other repo; not a hard gate.

**Cross-repo contract handoff**: for each `related_repos` entry not `done` **and** with `contract_handoff: "pending"`, when `03-design.md` §"External contracts" is not "none". `03-design.md` lives under git-ignored `.claude/work/`, so the literal contracts never reach the other repo on their own; only `scope` does.

1. **Select what crosses.** Only the contracts *that sibling consumes* ("Known consumer" points at it). "Known consumer" blank → ask the user which contracts that repo consumes; never publish all. Copy them **verbatim** from `03-design.md` (same rule as `/flow:feat:build` §2.0bis — a paraphrased contract is a new contract). Acceptance criteria, the ADR-light and "Internal behavioral contracts" do **not** cross.
2. **Where.** A comment on the tracker ticket — the anchor both sides share (`/flow:feat:start` §3.5 sends the sibling to the *same* ticket; `/flow:feat:start` §2.1 and `/flow:bug:start` §1.1 read the comment thread). Requires `tracker.tool` not `none`/empty and `meta.json.ticket` a real tracker id. **Fallback** (no tracker, or local-only ticket): write the block to a **versioned** file in this repo (`docs/contracts/<TICKET>.md` or where `conventions` puts docs — never under `.claude/work/`) and name that path in the reminder.
3. **Preview, always.** Show the exact comment text and ask with `AskUserQuestion` (publish / edit / skip) **in every `autonomy.mode`, no exceptions** — same rule as §3. Never publish unreviewed prose into a shared tracker.
4. **Record it.** On publish, set that entry's `contract_handoff` to `published → <ticket comment url or file path>`. On skip, leave it `pending` — the reminder fires again next ship, by design. Failure to post → warn in one line, leave `pending`, never block the ship.

Still "notes and reminds": the contract goes to the tracker or to this repo, never into the sibling's working tree. Not a hard gate — a skipped handoff never stops a merged MR/PR from closing out.

Only if `phase = "done"`:
- Ask whether to keep `.claude/work/<TICKET>/` or archive it (move to `.claude/work/_archive/`).
- If `meta.json.worktree` is not null, offer to remove the worktree (from the main checkout) with `git worktree remove <worktree>` (`--force` only if it still has changes the user confirms discarding). Never without confirmation, never if the MR/PR is not yet merged.

On a **train MR/PR** neither offer fires (`phase` is not `done`; the branch is the base of the next one). When shipping an intermediate MR/PR whose predecessor has since merged, say so in one line and point at `/flow:work:clean`, which sweeps the whole backlog at once. Mention it once per work, not per MR/PR.
"""
