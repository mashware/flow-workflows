## 4. Commit, push, and MR/PR creation

### 4.0 Anti-deploy lock (before any push)
Verify, and **block** if anything fails:
```bash
git rev-parse --abbrev-ref HEAD                          # must NOT be master/main
git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null   # must NOT be the base branch
```
- HEAD is master/main → stop and warn. Never push from the main branch.
- Upstream is `<git.default_base>` (branch created without `--no-track`) → **do not push resolving the upstream**. Fix with `git branch --unset-upstream`, then `git push -u origin HEAD`.
- Train mode (`stacked_on` ≠ null) → the MR/PR must target that parent branch, not the main base.

### 4.1 Create MR/PR
Only here — with the content approved in §3 — invoke `Skill commit-commands:commit-push-pr` passing **the final title and description**. The skill must not re-ask for the content; if it does, answer with what was confirmed. Any push it does must be `git push -u origin HEAD` (own branch), never to the base branch.

- `git.assignee` not empty → assign to that user. `git.squash` `true` → enable squash-before-merge.
- `commit-push-pr` skill unavailable → commit and push manually and create the MR/PR with the `git.cli` CLI from `FLOW.md` — always with the content confirmed in §3.

**Record the URL the moment it exists**: write it into this MR/PR's `meta.json.mrs` entry and refresh `panel.json` right here, before §4.2 and before anything else can fail.

### 4.2 Pre-deploy thread (deployment gate)
**Only if `git.predeploy_gate` is active and the branch has pre-deploy SQL** (§2). After creating the MR/PR, open **a single resolvable/blocking thread** with **all** the consolidated SQL, using the `git.host`/`git.cli` host:
- **GitLab**: `glab api "projects/<repo-url-encoded>/merge_requests/<iid>/discussions" -f body="..."` (resolvable thread).
- **GitHub**: a review conversation that requires resolution before merging ("require conversation resolution" policy).

Thread body: the SQL block under "Pre-deploy: run this SQL on the server BEFORE deploying" + "Resolve this thread only after having executed it in production."

With the repo policy "all threads resolved before merge", the MR/PR cannot merge until the SQL is executed and the thread **resolved**. **One single thread even with multiple statements.** Tell the user it is left open on purpose.

