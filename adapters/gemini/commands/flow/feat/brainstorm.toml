description = "Generate options, angles, and risks for the feature before designing"

prompt = """
# `/flow:feat:brainstorm`

Read `FLOW.md` at the repo root for this repo's conventions (tracker, git, quality, domain, observability). If it does not exist or a key is empty, use the default value or auto-discover as each step indicates. Regarding `domain_memory`: if it is active but the MCP fails or takes more than 2 s, continue without that context — do not block or notify the user. Also, if `FLOW.md` has a `notes` entry for this command (or an `all` entry), follow it as mandatory additional guidance for this step.

**Autonomy.** Read `autonomy.mode` from `FLOW.md` (`manual` | `guided` | `auto`; empty = `manual`) and apply it throughout this command. `manual` — stop at every decision point; at the end, propose the next command by asking the user to confirm it (write the question with the recommended next step as the default numbered option) and invoke it only when the user confirms — never advance without that confirmation, never make the user type it. `guided` — resolve low-risk, unambiguous decisions yourself using the recommended default and record the choice in the phase artifact instead of asking; still ask at genuine decision points; at the end, chain into the recommended next command automatically. `auto` — as `guided`, and also auto-resolve the remaining decision points with sensible (recorded) defaults, chaining phases without pausing. **Hard gates — ALWAYS stop and ask the user, in every mode, no exceptions:** (1) any push or MR/PR creation (all of `ship`); (2) creating or switching a branch when the base is ambiguous (not on a clean main, or a possible train/stacked branch); (3) DB schema changes or migrations; (4) a `review` that surfaced high-severity findings — never chain into `ship` on those. Rule of thumb for everything else: ask only when a decision is (a) irreversible or costly to undo, (b) ambiguous and not resolved by the ticket + domain-memory, or (c) a hard gate; otherwise take the sensible default and record it in the artifact.

**Never a question in `guided`/`auto` — decide, record, continue.** The hard gates above stop in *every* mode; these stop in *none* of `guided`/`auto`, and asking them anyway is the single most common way an unattended run ends up feeling manual. (a) **Flow mechanics** — whether to launch a subagent panel, challengers or a skeptic filter, how many reviewers, inline vs subagent: that is your judgement on cost and latency, not the user's decision, and each step's recommended default *is* the answer. (b) **WIP commits** on the work branch. (c) **Continuing to the next MR/PR of a train** when `git.train_chain` resolves to `always`. (d) **Size confirmation** — take the proposed size, record it, move on. (e) **Anything already decided and recorded** in this work's artifacts or `meta.json.notes`: reopening a settled decision is not prudence, it makes the user decide twice and costs them their trust that a decision *stays* decided. Reopen only when new evidence contradicts the premise it rested on — and then lead with the evidence, not with the question.

**Reporting — how every stop reads.** When this command stops — a question, a hard gate, or the end of the turn — the user is coming back to a screen they walked away from, often with other works running in other panes. They have **not** read your tool calls, your subagents' reports, or the artifacts you wrote. So every stop **opens with this header**, before any prose:

```
<TICKET> · <size> · phase <phase> · MR #<n> of <N>
Plan: <k> of <N> shipped — #1 <url/id> <state> · #2 <state> · #3–#N pending
Now: <one line — what just finished>
I need: <one line — the decision or action you need from them, or "nothing, continuing with X">
```

Take every fact from `meta.json` (`ticket`, `size`, `phase`, `mrs[]`), never from memory. Drop the `MR #<n> of <N>` and `Plan:` lines when the work has no `mrs`. After the header, **at most ~10 lines of body**, and only what could change a decision the user might take. Everything else goes to the phase artifact, which is where it stays useful.

**Out of the chat, into the artifact**: narrating your own process or your own mistakes, correcting your subagents' reports, bookkeeping (directory names, how you located `meta.json`), and anything a previous stop already said. **Subagent completion notices never earn a turn of their own** — absorb them into the next real stop.

**Zero-context rule.** Write for someone who just sat down. The first mention of a code identifier (class, method, constant, error code) carries 4–6 words of what it is — not `fromStored()` but "`fromStored()`, the method that rehydrates a stored token". Never cite a section number (`§4.2`) without naming what it is. No jargon the user has not used first.

**A question is asked as a question.** Never end a message with one buried in prose: write it as an explicit numbered choice with the recommended option marked, and wait. In `manual` a question hidden in the text is invisible; in `guided`/`auto` it is a stop the mode never authorized. If it does not deserve to be numbered and waited on, it is not a question — it is a decision you take and record.

Exploration phase. **Does not write code.** Only opens the solution space so the design does not start from the first idea.

## 1. Pre-flight

- Locate the active `meta.json`: first look by the current branch (`git branch --show-current`), otherwise ask for the ticket.
- If `meta.json.phase` is not `context`, warn and ask whether to continue anyway.
- If `size` is `XS` or `S`, suggest skipping directly to `/flow:feat:design` or `/flow:feat:build` and stop (unless the user insists).
- Read `01-context.md`.

## 2. Focused domain-memory query

If `domain_memory.enabled` is `true` in `FLOW.md`: before generating options, call `mcp__domain-memory__search_knowledge` with queries focused on the **concept/pattern** the feature covers, not the generic title (that was already queried in `/flow:feat:start`). Examples by area:

- If the feature touches tracking → `"tracking deduplication"`, `"hash collision"`.
- If it touches payments → `"trial expiration"`, `"plan downgrade flow"`.
- If it touches external integrations → `"attachment handler"`, `"tax rules integration"`.

Launch 2-3 queries in parallel (or sequentially if parallelism is not possible). Timeout 2 s; if it fails, continue without context and do not notify the user. Note relevant hits in `02-brainstorm.md` under "Additional domain knowledge" (do not repeat what is already in `01-context.md`). If `domain_memory.enabled` is `false` or empty, skip without notifying.

## 3. Work

### 3.0 Multi-agent panel or single agent?

- If `meta.json.size` is **M or L**: ask the user directly in text: "Generate the options with a parallel multi-agent panel? More costly in tokens, less bias from a single line of thought." If they accept → §3.A. If they decline → §3.B. In **`guided`/`auto`, do not ask** — this is flow mechanics (cost and latency), not a decision about the product: take the panel for M/L, note it in one line of the artifact, and go to §3.A.
- If **S** (or the user declined): §3.B directly. Panel not offered for XS/S — the cost does not justify it.

### 3.A Approach panel (parallel subagents)

If the environment has subagents defined in `.gemini/agents/`, launch one per lens in parallel (without seeing each other → real diversity) and a final agent that synthesizes and ranks them. The lenses are:

- `minimal`: the SMALLEST approach that solves the declared use case, nothing more (strict MVP).
- `reuse`: the approach that MOST reuses existing pieces in the affected module or neighbors.
- `operations`: the most production-solid approach (observability, external integration failure, data at scale).
- `rethink`: challenges the premise: what if the problem is solved without building what is requested, or elsewhere?

Each agent receives: the ticket title, path to `01-context.md`, and the instruction to propose ONE approach from its specific lens — real modules/layers of the project, main risk, and why it could be a bad idea. It does not write code.

Then run a **peer-review round** (the LLM-council step that keeps synthesis from ranking on presentation instead of substance): relaunch the lens agents in parallel, each now **seeing all the approaches**, and have each critique the OTHERS from its lens — for every approach the single biggest flaw for THIS project (or "none"), plus which is strongest and which weakest. Grounded in the project; no invented flaws.

The synthesizer agent receives the approaches **and the peer-reviews**, ranks them from best to worst for THIS case (fit in the project + simplicity) weighing the surfaced fatal flaws, states where the lenses agreed and where they disagreed, and gives an initial recommendation with 2-3 lines of justification.

If a subagent fails, simply do not include its approach in the result.

### 3.B Single agent (default)

Work directly (or delegate to a generic agent) with this assignment:

> Generate 3-5 different approaches for solving `<title>` following the project conventions (see `FLOW.md` and `.claude/work/<TICKET>/01-context.md`). For each approach: one sentence on what it is, affected modules/layers, main risk, and why it could be a bad idea. Do not write code. Report in markdown under 400 words.

If the feature touches a sensitive domain (payments, authentication, tracking), also launch **in parallel** (or sequentially) a second angle focused on "what can go wrong" for that domain.

## 4. Output

Create `.claude/work/<TICKET>/02-brainstorm.md`:

```markdown
# Brainstorm <TICKET>

## Additional domain knowledge
<hits from the focused search_knowledge, or "no findings">

## Options considered
### Option A: <name>
- What it is:
- Affected modules/layers:
- Main risk:
- Why it could be a bad idea:

### Option B: …
### Option C: …

## Cross-cutting risks
<bullets>

## Initial recommendation
<one option, with 2-3 lines of justification. If the panel ran (§3.A), prefix with a one-line
"Panel consensus / disagreement:" summarizing where the advisors' peer-review agreed and where it split.>
```

## 5. Emerging questions

Looking at options often reveals new questions that `/flow:feat:start` did not surface (e.g. "does this only apply to paid plans?", "what happens if the user already has N of these?"). If any appeared, **ask the user before closing** directly in text. Note the answers at the end of `02-brainstorm.md` under "Decisions clarified in /flow:feat:brainstorm".

## 6. Is the size still correct?

After reviewing the options, evaluate whether `meta.json.size` still matches the actual scope:

- If the brainstorm suggests the feature is much simpler/more complex than assumed, **propose reclassifying to the user** (direct text question) with the new estimate and one line of justification.
- If confirmed, update `meta.json.size` and note the change in `meta.json.notes` (`"size: M→S after brainstorm — chosen option does not require migration"`).
- If they keep the size, continue.

## 7. Close

- Update `meta.json`: `phase = "brainstorm"`, add to `phases_done`, update `updated_at`.
- Show the user the options and ask them to choose (or request adjustments) **before** moving to `/flow:feat:design`. If they pick one, note it in `meta.json.notes`.
- **Autonomy handoff.** Choosing an option is a genuine decision point: in `manual` and `guided`, ask for the choice. In `auto`, take the recommended option, record it (and why) in `meta.json.notes` and **chain into `/flow:feat:design` automatically** in this same turn. In `manual`, propose the next command as a question instead of leaving it for the user to type.
"""
