## 2. Invoke the code reviews

Scope for every reviewer: the full feature work against the base branch (committed + working tree — commits are opt-in).

### 2.0 Resolve review depth (scale to the work size and the risk)
Read `quality.review_depth` from `FLOW.md` (`proportional` | `full` | `light`; empty → `proportional`) and `meta.json.size`. This decides **what §2.1 launches and at which effort**. Built-in `code-review` effort ladder: **low < medium < high < xhigh < max** (lower = fewer, higher-confidence findings; higher = broader coverage, may surface uncertain ones).

- **`full`** (any size): built-in `code-review` at **xhigh** + the project panel. Skip the tiering below.
- **`light`** (any size): built-in `code-review` (or `quality.review_skill`) **only**, at **medium** effort. No project panel, no §3 reinforcements, no §6 skeptic fan-out. The sensitive-surface bump still applies: a sensitive surface upgrades `light` to the `proportional` tier for that work.
- **`proportional`** (default), base effort by size:

| Size | Built-in `code-review` | Project panel (`review_skill`/`reviewers`) |
|---|---|---|
| XS | **medium** | do **not** launch |
| S | **high** | only if the diff touches a sensitive surface; otherwise the built-in alone is the review |
| M | **high** | full panel |
| L | **xhigh** | full panel |

- **Sensitive-surface bump** (proportional, any size): the diff touches authentication/authorization, secrets/credentials, payments/billing, personal or otherwise sensitive data, a public API/contract shape, or a DB migration/schema change → **raise the built-in effort one tier** (medium→high→xhigh→**max**) and always run the panel. S/M on a sensitive surface → **xhigh**; **L on a sensitive surface → `max`**.

Record in `06-review.md` which tier and effort ran and why (e.g. "L + DB migration → built-in at `max` + panel").

### 2.1 Launch and consolidate
Launch the reviewers selected in §2.0 and **consolidate their findings into a single deduplicated report**:

1. **Built-in `code-review`** (the Claude Code one, no prefix), at the §2.0 effort. Single pass over the local diff: correctness failures + reuse/simplification/efficiency.
2. **Project panel** (only when §2.0 selected it): read `quality.review_skill` from `FLOW.md`.
   - `review_skill` set → invoke that skill with `03-design.md` as additional context. Scope: `git diff <git.default_base>...HEAD`, plus uncommitted working-tree changes.
   - `review_skill` empty, `quality.reviewers` has entries → launch each agent in parallel as a panel, same context and scope.
   - Both empty → step 1 already covers this pass; launch nothing more.

   Launch the panel **as defined** — whole roster, no hand-picked subset, no substitutions (each member owns a category nothing else repeats). An agent that genuinely cannot run → record it in §8 `Agents launched` with the reason.

   **Every brief you write here ends with the report contract of flow-core §6** — `agents.report_max_words` (empty → 250), findings only, one line each as `file:line` + what is wrong + the fix. This file's own prompts (§3.5, §4, §5.5) already carry theirs; the panel briefs are yours to write, and an uncapped one is truncated in transit and reaches you looking exactly like a reviewer that found nothing. The built-in `code-review` takes no brief — bound it with the §2.0 effort tier and hold it to the same fan-out deadline (flow-core §6): over a large diff it is the likeliest member of this round to stall before its first sentence.

When both run, deduplicate overlapping correctness/simplification findings (count each once). The `review_skill` specialists (offensive/defensive security, silent failures, architecture) are not repeated in later phases.

### 2.2 Design truth vs design rationale (do not inherit rationalizations)
`03-design.md` goes to reviewers as context, with unequal authority:
- **Contracts and acceptance criteria are truth** — verify the code meets them.
- **Pattern/architecture decisions and their justifications** (the ADR-light "Why" column, *"respects bounded contexts"*, *"for consistency"*) are **hypotheses, not axioms** — refute them when the code tells a different story. Every "Why" is a claim to test, never a reason to stop looking.

**This applies to the briefs you write, too.** A decision already taken goes to the reviewer as **context**, never as a scope exclusion: *"X is decided — tell me what consequences it has that we have not seen"*, never *"do not report X"*.

## 3. Targeted reinforcements

Only what §2 does **not** already cover; skipped entirely under `light` (§2.0). Same report contract as §2.1 (flow-core §6) on every brief. If the feature touches these areas, additionally launch **in parallel**:

- **Any repeated call that leaves the process** (external API, HTTP, cache, filesystem) → `agents.performance` from `FLOW.md` on the changed files; empty → skip. Have it cover what **each failed iteration** sets off downstream (publishes, enqueues, disables, logs), not just the happy path's cost. **Queries are not covered here** — §3.6 owns them.
- Workers / message queues → `agents.queues` from `FLOW.md`: no `flush()` in a loop; workers registered per the project convention (`FLOW.md` section `conventions`); empty → skip.
- Frontend → interface code changed: `agents.frontend` from `FLOW.md`; affected frontend tests too: `agents.frontend_test` as well; either empty → skip that one.

## 3.5. Completeness sweep (anti-abandonment, M/L only)

Counters a reviewer abandoning a large diff early. **Only if `meta.json.size` is M or L.**

Loop, maximum **2 rounds**:

1. **Worklist**: `git diff --stat <git.default_base>...HEAD` → list of changed files/areas.
2. **Coverage map**: from the consolidated §2-§3 findings, mark which files/areas received at least one finding or were explicitly examined.
3. **Completeness critic (1 agent, blinded)**: `Agent general-purpose` (takes this command's `models.review` key like every other subagent here), passing **only** the full diff file list (step 1) and, per §2-§3 reviewer, one line on what it covered. **Do not** pass the detailed findings or the design. Prompt:

   > You are a coverage auditor for a code review. I give you (1) the list of files changed in this diff and (2) a one-line summary per reviewer of what area each one covered. Your only task: name the files or areas in the diff that **no** reviewer examined, and any claim a reviewer accepted as correct without verifying. Do not opine on existing findings. Output: list of concrete gaps (`file/area` + why it deserves a second look) or exactly "none". Under 150 words.

4. **Fresh gaps named** → relaunch a targeted round **only on those files/areas** with the applicable `quality.review_skill` reviewers (paths constrained to the gaps). Merge and deduplicate against the consolidated findings.
5. **Repeat 2-4** until a round returns "none" **or** 2 rounds are reached.
6. **No silent truncation**: gaps still flagged after 2 rounds → **record them literally** in the output under "Areas not covered after 2 rounds" with their reason.

Sweep findings enter the normal flow: §4, §5, §6 like any other.

## 3.6 Data-access duel (queries are tried on their plan, not their prose)

A query's cost lives in its **execution plan** (existing indexes, column order/direction, join types and collations, real cardinality) — none of it in the diff, so no reading reviewer covers it.

**When it runs.** The diff **adds or modifies** a query — raw SQL, ORM query language, query-builder chain, repository finder, a relation traversed in a loop, an aggregate/count, a bulk write, a migration or index change, or the equivalent read against a search engine or key-value store. **Any size, XS included** (a category, not a depth tier). **Not** for renames, reformats, or a query moved without changing filter, order, bound, joins or columns — say so in one line and skip.

**How it runs.** Follow **`/flow:work:query`** over the queries in the diff: its **§2 fact sheet** (call site and frequency, filter, order **with direction**, bound and global vs per key, both sides of every join with real types and collations, heavy columns, expected cardinality with source, indexes read from the schema not the mapping); its **§3 duel** (challenger blinded to the design's rationale walking the twelve-item checklist, defence answering with plans and numbers, main agent judging); its **§4 measurement** when the schema alone cannot settle it, gated as that command gates it; its **§5 verdict** shape — one recommendation with the number behind it.

Judging rules: **no number, no win** (unresolved is recorded unresolved, never split in prose); **no dogma in either direction** ("N small queries is an N+1" and "one batched query always wins" both need a measurement); **a defect that predates the diff is declared and ticketed separately**, never used to bless the diff nor dragged into it.

**A modified query is judged against its own past, not only against its rivals.** For every query the diff *changes* (as opposed to adds), the duel carries the **base row** — the same query on `git merge-base HEAD <git.default_base>`, measured in the same sandbox with the same seed (`/flow:work:query` §4). Without it the table cannot say whether this diff made things better or worse, which is the one thing a reviewer wants from it.

Verdicts as findings: **change** = blocker, through §6; **regressed** = blocker unless `03-design.md` justifies the trade, in which case it is stated and published; **schema / follow-up** → proposed ticket in the output **and a `followups[]` entry** (flow-core §7); **unresolved** → recorded literally with the open question (as §3.5). A `change` verdict resting on a measured plan is already confirmed — no §6 skeptic.

## 4. Over-engineering audit (fit + YAGNI)

**Second barrier against over-engineering** (the first is the challenger in `/flow:feat:design`). Independent of §2: look for what is **unnecessary**, not what is missing.

1. **Locate every defensive mechanism in the diff**: validation, guard, retry, lock, fallback, cache, idempotency, circuit breaker, queue, flag.
2. **Find its row** in the "Defensive mechanisms and their justification" table in `03-design.md`.
   - **No row** → blocker (slipped past the design filter). Ask: what real and present scenario in the project justifies it?
   - **Row with a hypothetical scenario** ("just in case", "it could happen that…", "in the future") → blocker of type "unnecessary".
3. **Verify the scenario against the code, not paper**: can the flow reach that state? Does an upstream already prevent it? A quota/constraint already bound it? Is it redundant with something existing? If `knowledge.search` is set, query it when the scenario depends on domain rules.
4. **Key question per piece**: *"if I remove this, what breaks in the project — today, not in a hypothetical future?"*. Honest answer "nothing that can really happen" → over-engineering finding.

"Unnecessary" findings go to Blockers with a concrete proposal: "remove X — protects against Y, which cannot happen because Z (evidence)".

## 5. Double-blind contract verification

If `05-implementation.md` has a "Contracts to respect" section, launch an `Agent general-purpose` with a **deliberately blinded** prompt — it receives exactly two things:

> You are a contract reviewer. You must say whether the diff meets some literal contracts I give you. **You have no access to the rest of the design, the controller context, the brief, or the implementation explanations.** Only:
>
> 1. **Contracts to respect** (copied verbatim from design):
>    <PASTE here the "Contracts to respect" section from `05-implementation.md` as-is, without reformatting>
>
> 2. **Diff of relevant files**: the shape constructions (JSON arrays, JsonSerializable, events, headers, routes, columns, metrics) from the changed files:
>    <PASTE here only the diff hunks that touch shape construction, not the full file>
>
> Your only task: for **each contract** in block 1, tell me whether the code in block 2 produces **exactly** that shape — key by key, nesting by nesting, same case, same singular/plural. Output: table `| Contract | Matches (yes/no) | If not: what differs |`. Under 200 words. Do not rationalize mismatches ("maybe they meant X"): if it differs, say so.

Blinded because full code or design lets the agent rationalize the mismatch from nearby justifications.

Any "no" → blocker: a broken-contract finding with the concrete fix proposal.

No "Contracts to respect" (build recorded "N/A") → skip this step.

## 5.5 Idiom / primitive audit (blind to the design's rationale)

§2-§3 check whether the code **respects the design's boundaries**, not whether the design **picked the right primitive** (a "Command" that only reads, a handler injecting the bus just to call another handler). This pass asks the fresh senior reviewer's first-read question, **blinded** to the design's prose like §5.

**When to run**: only if the diff **introduces new architectural pieces** (new classes, new wiring, new use of a stack primitive — not renames or tweaks). Then: **always on M/L**; on **S** only if it introduces such pieces or touches a sensitive surface; **skip on XS**. Launch the `agents.architecture` agent from `FLOW.md` (or `Agent general-purpose` if empty) with this self-contained brief:

> You audit the **idiom** of the new code — not its correctness, not whether it respects the design. You receive ONLY: (1) the new/changed architectural pieces of this diff (new classes, their constructor dependencies, how they are wired), and (2) the project's primitive vocabulary from its conventions (see `FLOW.md` `conventions`). **You do NOT receive the design document or its justifications.** If a choice was rationalized in prose elsewhere, that rationale is exactly what you must not inherit — your value is asking "why does this exist?" *without* the paper answer.
>
> For each new piece, ask what a fresh senior reviewer asks on first read:
> - **Does this class do what its role/name promises?** A `Command`/`Query` doing the opposite (a command that only reads, a query that mutates); a `Service`/`Finder` that is a thin pass-through; a `Handler` with no handling logic.
> - **Why does it depend on what it depends on?** Especially: an entry-point primitive (bus, dispatcher) injected only to call *another* handler (handler-to-handler dispatch); a bus used as glue between two internal pieces instead of as an entry point; an interface whose only consumer is another handler.
> - **Is there a simpler, more honest primitive?** If the piece is a service disguised as something else, name the primitive it should be.
> - **Lost type/contract**: a return typed `mixed`/`object` patched with a `@var` docblock is a signal the wrong seam was chosen.
>
> Output: per finding, `file:line`, the smell in one line, and the honest alternative primitive. Say nothing about pieces that are idiomatic. Do not invent smells to fill space — "the new pieces are idiomatic" is a valid, good result. Under 250 words.

Findings enter the normal flow: §6, then the output. Blinded for the same reason as §5.

## 6. Adversarial finding verification (parallel fan-out, optional)

A filter against over-reporting, not a second review; narrow gate. Never runs under `light` (§2.0).

**When it runs.** All three conditions:

| Condition | Threshold |
|---|---|
| Size | `meta.json.size` is **M or L** |
| Diff | the MR/PR diff is **over 150 changed lines** |
| Findings | **≥ 4** ambiguous findings across §2-§5 |

Read the real diff (`git diff --stat` against the target branch), not the recorded size.

When all three hold: in **`manual`**, offer it with `AskUserQuestion` ("Verify the ambiguous findings with skeptics in parallel? Discards false positives before you go fix them."). In **`guided`/`auto`, do not ask** — flow mechanics: run it and note in `06-review.md` that you did.

**What gets verified — only the ambiguous ones.** A defect visible in the diff is already confirmed. Verify only findings resting on code *outside* the diff, a runtime behaviour, or an unchecked convention. Everything else goes straight to the output.

**How wide.** Read `agents.fanout_max` from `FLOW.md` (empty → **4**). **One skeptic per finding, in parallel, capped at `fanout_max`** — more ambiguous findings than that: verify the `fanout_max` most consequential, pass the rest through unverified, marked as such. A finding is discarded when its skeptic refutes it.

> You are a skeptic. This is a code review finding on the project: file `<file:line>`, problem: `<description>`, proposal: `<proposal>`. Try to REFUTE it: read the real code and say whether the problem is NOT real (refuted) or is real (stands). The burden of proof is on the finding — when the evidence is genuinely ambiguous, refute. Be concrete about why, citing what you read.

Refuted findings leave blockers/suggestions and go under "Discarded by verification" with the reason. **One skeptic, not three** — a wrongly-discarded finding stays visible in the artifact.

`agents.fanout_tool` set in `FLOW.md` → run the verification through that tool; gate, ceiling and one-skeptic rule unchanged (see `agents` in `FLOW.md` and `examples/FLOW.template.md`).

Not run for XS/S, small diffs, or fewer than 4 ambiguous findings. When skipped, say so in one line of `06-review.md` — skipped and clean are not the same result.

