name: publish

# npm is the only distribution channel opencode, Gemini and Hermes have, and it was the
# one release step nothing enforced: v0.63.0 was tagged, released and announced while npm
# still served v0.62.0, with nothing anywhere saying so. Publishing the GitHub release now
# publishes the package, so the two cannot drift apart again.
#
# The manual trigger exists for a release whose tag predates this workflow, or a publish
# that failed for a reason worth retrying:
#
#   gh workflow run publish.yml --ref main -f tag=vX.Y.Z
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.63.0"
        required: true

permissions:
  contents: read
  id-token: write               # npm trusted publishing (OIDC) and the provenance stamp

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0        # check.py asks git about the tree
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"        # not the floor `engines` declares — that is preflight's job
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing landed in npm 11.5.1, and the runner ships 10.x. Pinned to the major
      # rather than `@latest`: npm 12 requires Node 22.22+/24.15+ and broke this step the first
      # time it ran, which is a poor way to find out on the day of a release.
      - name: npm 11.5.1+, where trusted publishing landed
        run: npm install --global "npm@^11.5.1"

      - name: the tag and package.json must agree
        id: version
        # The tag reaches the shell through the environment, never through `${{ }}` inside a
        # run block: it is attacker-controlled input the moment anyone but a maintainer can
        # publish a release, and a tag named `$(…)` would otherwise be executed here.
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$TAG"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag, package.json $pkg. package.json is generated by" \
                 "adapter-build.py from the plugin manifest — it was not rebuilt after the bump."
            exit 1
          fi
          echo "n=${pkg#v}" >> "$GITHUB_OUTPUT"
          # A prerelease must never move `latest`: every `npx flow-workflows` in the wild
          # resolves that tag, so publishing 0.65.0-rc.1 as latest would serve a release
          # candidate to everyone who never asked for one. The suffix decides the channel.
          case "${pkg#v}" in
            *-*) echo "channel=next"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "channel=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: the same preflight a maintainer runs before tagging
        run: python3 script/check.py

      - name: generated files are current
        run: python3 script/adapter-build.py --check

      - name: already on npm? then there is nothing to do
        id: state
        env:
          N: ${{ steps.version.outputs.n }}
        run: |
          if npm view "flow-workflows@$N" version > /dev/null 2>&1; then
            echo "flow-workflows@$N is already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: what the tarball carries
        if: steps.state.outputs.skip == 'false'
        run: npm pack --dry-run

      - name: publish
        if: steps.state.outputs.skip == 'false'
        # No token configured → npm falls back to trusted publishing over OIDC, which is the
        # intended path: nothing to store, nothing to rotate. NPM_TOKEN is honoured if the
        # repository has one, so a maintainer can switch back without editing this file.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: npm publish --provenance --access public --tag "$CHANNEL"

      - name: say what npm now serves
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          echo "npm \`$CHANNEL\`: flow-workflows@$(npm view "flow-workflows@$CHANNEL" version)" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" != "latest" ]; then
            echo "npm \`latest\`: flow-workflows@$(npm view flow-workflows version) (untouched)" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
